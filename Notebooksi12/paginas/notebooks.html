<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notebooks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .btn-volver {
            background: #6c757d;
        }

        .btn-volver:hover {
            background: #5a6268;
        }

        .contenedorNotebooks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9ff;
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 12px rgba(102, 126, 234, 0.3);
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card p {
            margin: 8px 0;
            color: #333;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
        }

        .estado-disponible {
            background: #10b981;
        }

        .estado-prestamo {
            background: #f59e0b;
        }

        .estado-reparacion {
            background: #ef4444;
        }

        .estado-fuera {
            background: #6b7280;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-editar {
            flex: 1;
            background: #667eea;
            padding: 10px;
            font-size: 14px;
        }

        .btn-eliminar {
            flex: 1;
            background: #ef4444;
            padding: 10px;
            font-size: 14px;
        }

        .btn-editar:hover {
            background: #5568d3;
        }

        .btn-eliminar:hover {
            background: #dc3545;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor">
        <h1>💻 Gestión de Notebooks</h1>
        
        <div class="toolbar">
            <button class="btn-volver" id="btnVolver">⬅️ Volver al Menú</button>
            <button id="btnAgregar">➕ Agregar Notebook</button>
        </div>

        <div class="contenedorNotebooks" id="contenedorNotebooks"></div>
    </div>

    <script type="module">
        import { obtenerNotebooks, guardarNotebook, actualizarNotebook, eliminarNotebook } from "../bbdd/BBDD.js";

        const contenedor = document.getElementById("contenedorNotebooks");
        const btnAgregar = document.getElementById("btnAgregar");
        const btnVolver = document.getElementById("btnVolver");

        const estadoClases = {
            "Disponible": "estado-disponible",
            "En préstamo": "estado-prestamo",
            "En reparación": "estado-reparacion",
            "Fuera de servicio": "estado-fuera"
        };

        const crearCard = (notebook) => {
            const card = document.createElement("div");
            card.className = "card";

            const clase = estadoClases[notebook.estado] || "estado-disponible";

            const span = document.createElement("span");
            span.className = "estado " + clase;
            span.textContent = notebook.estado;

            const h2 = document.createElement("h2");
            h2.textContent = notebook.codigo;

            const p1 = document.createElement("p");
            p1.innerHTML = "<strong>Marca:</strong> " + notebook.marca;

            const p2 = document.createElement("p");
            p2.innerHTML = "<strong>Modelo:</strong> " + notebook.modelo;

            const p3 = document.createElement("p");
            p3.innerHTML = "<strong>Procesador:</strong> " + notebook.procesador;

            const p4 = document.createElement("p");
            p4.innerHTML = "<strong>RAM:</strong> " + notebook.ram;

            const p5 = document.createElement("p");
            p5.innerHTML = "<strong>Almacenamiento:</strong> " + notebook.almacenamiento;

            const btnEditar = document.createElement("button");
            btnEditar.className = "btn-editar";
            btnEditar.setAttribute("data-id", notebook.id);
            btnEditar.textContent = "Editar";

            const btnEliminar = document.createElement("button");
            btnEliminar.className = "btn-eliminar";
            btnEliminar.setAttribute("data-id", notebook.id);
            btnEliminar.textContent = "Eliminar";

            const botones = document.createElement("div");
            botones.className = "botones";
            botones.appendChild(btnEditar);
            botones.appendChild(btnEliminar);

            card.appendChild(span);
            card.appendChild(h2);
            card.appendChild(p1);
            card.appendChild(p2);
            card.appendChild(p3);
            card.appendChild(p4);
            card.appendChild(p5);

            if (notebook.observaciones) {
                const pNota = document.createElement("p");
                pNota.innerHTML = "<strong>Nota:</strong> " + notebook.observaciones;
                card.appendChild(pNota);
            }

            card.appendChild(botones);

            return card;
        };

        const cargarNotebooks = () => {
            contenedor.innerHTML = "";
            const notebooks = obtenerNotebooks();

            for (let i = 0; i < notebooks.length; i++) {
                const card = crearCard(notebooks[i]);
                contenedor.appendChild(card);
            }

            agregarEventos();
        };

        const agregarEventos = () => {
            const botonesEditar = document.querySelectorAll(".btn-editar");
            const botonesEliminar = document.querySelectorAll(".btn-eliminar");

            for (let i = 0; i < botonesEditar.length; i++) {
                botonesEditar[i].addEventListener("click", (e) => {
                    const id = parseInt(e.target.dataset.id);
                    editarNotebook(id);
                });
            }

            for (let i = 0; i < botonesEliminar.length; i++) {
                botonesEliminar[i].addEventListener("click", (e) => {
                    const id = parseInt(e.target.dataset.id);
                    eliminarConfirm(id);
                });
            }
        };

        const mostrarFormulario = async (titulo, notebook = null) => {
            const codigo = notebook ? notebook.codigo : "";
            const marca = notebook ? notebook.marca : "";
            const modelo = notebook ? notebook.modelo : "";
            const procesador = notebook ? notebook.procesador : "";
            const ram = notebook ? notebook.ram : "";
            const almacenamiento = notebook ? notebook.almacenamiento : "";
            const estado = notebook ? notebook.estado : "Disponible";
            const observaciones = notebook ? notebook.observaciones : "";

            const { value: resultado } = await Swal.fire({
                title: titulo,
                html: `
                    <div style="text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Código:</label>
                            <input id="codigo" class="swal2-input" value="${codigo}" style="width: 100%;">
                        </div>
                        
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Marca:</label>
                            <input id="marca" class="swal2-input" value="${marca}" style="width: 100%;">
                        </div>
                        
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Modelo:</label>
                            <input id="modelo" class="swal2-input" value="${modelo}" style="width: 100%;">
                        </div>
                        
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Procesador:</label>
                            <input id="procesador" class="swal2-input" value="${procesador}" style="width: 100%;">
                        </div>
                        
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">RAM:</label>
                            <input id="ram" class="swal2-input" value="${ram}" style="width: 100%;">
                        </div>
                        
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Almacenamiento:</label>
                            <input id="almacenamiento" class="swal2-input" value="${almacenamiento}" style="width: 100%;">
                        </div>
                        
                        <div style="grid-column: 1 / -1;">
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Estado:</label>
                            <select id="estado" class="swal2-input" style="width: 100%;">
                                <option value="Disponible" ${estado === "Disponible" ? "selected" : ""}>Disponible</option>
                                <option value="En préstamo" ${estado === "En préstamo" ? "selected" : ""}>En préstamo</option>
                                <option value="En reparación" ${estado === "En reparación" ? "selected" : ""}>En reparación</option>
                                <option value="Fuera de servicio" ${estado === "Fuera de servicio" ? "selected" : ""}>Fuera de servicio</option>
                            </select>
                        </div>
                        
                        <div style="grid-column: 1 / -1;">
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Observaciones:</label>
                            <textarea id="observaciones" class="swal2-input" style="width: 100%; height: 80px;">${observaciones}</textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: notebook ? "Guardar" : "Agregar"
            });

            if (resultado) {
                const codigo = document.getElementById("codigo").value;
                const marca = document.getElementById("marca").value;
                const modelo = document.getElementById("modelo").value;
                const procesador = document.getElementById("procesador").value;
                const ram = document.getElementById("ram").value;
                const almacenamiento = document.getElementById("almacenamiento").value;
                const estado = document.getElementById("estado").value;
                const observaciones = document.getElementById("observaciones").value;

                if (codigo && marca && modelo && procesador && ram && almacenamiento) {
                    return { codigo, marca, modelo, procesador, ram, almacenamiento, estado, observaciones };
                } else {
                    Swal.fire("Error", "Completa todos los campos", "error");
                    return null;
                }
            }
            return null;
        };

        btnAgregar.addEventListener("click", async () => {
            const datos = await mostrarFormulario("Agregar Notebook");
            if (datos) {
                guardarNotebook(datos);
                cargarNotebooks();
                Swal.fire("Éxito", "Notebook agregada", "success");
            }
        });

        btnVolver.addEventListener("click", function() {
            window.location.href = "menu.html";
        });

        const editarNotebook = async (id) => {
            const notebooks = obtenerNotebooks();
            let notebook = null;

            for (let i = 0; i < notebooks.length; i++) {
                if (notebooks[i].id === id) {
                    notebook = notebooks[i];
                    break;
                }
            }

            const datos = await mostrarFormulario("Editar Notebook", notebook);
            if (datos) {
                actualizarNotebook(id, datos);
                cargarNotebooks();
                Swal.fire("Éxito", "Notebook actualizada", "success");
            }
        };

        const eliminarConfirm = async (id) => {
            const notebooks = obtenerNotebooks();
            let notebook = null;

            for (let i = 0; i < notebooks.length; i++) {
                if (notebooks[i].id === id) {
                    notebook = notebooks[i];
                    break;
                }
            }

            const resultado = await Swal.fire({
                title: "¿Eliminar?",
                text: `¿Eliminar ${notebook.codigo}?`,
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, eliminar"
            });

            if (resultado.isConfirmed) {
                eliminarNotebook(id);
                cargarNotebooks();
                Swal.fire("Éxito", "Notebook eliminada", "success");
            }
        };

        cargarNotebooks();
    </script>
</body>
</html>
